name: Build, test and package Windows preview
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: ./build.ps1 -Test
      - name: Package portable app
        shell: powershell
        run: ./package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v4
        with:
          name: Stroll-Windows-portable
          path: |
            release/*.zip
            release/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Stroll-Windows-portable
          path: release
      - name: Publish downloadable preview
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --title "Stroll $env:RELEASE_TAG preview" --notes-file RELEASE-NOTES.md --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          $assets = Get-ChildItem release -File | Where-Object { $_.Extension -in '.zip','.sha256' } | ForEach-Object FullName
          gh release upload $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
